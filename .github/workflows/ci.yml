name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  mix:
    name: Mix test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - name: Fetch deps
        working-directory: compiler
        run: mix deps.get
      - name: Test
        working-directory: compiler
        run: mix test

  vm:
    name: Lake build + smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - name: Install elan / Lean
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf |
            sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Lake build
        working-directory: vm
        run: |
          elan toolchain install "$(cat lean-toolchain)"
          lake build
      - name: Proof surface names
        working-directory: vm
        run: ./scripts/check_proof_surface.sh
      - name: Fetch Mix deps
        working-directory: compiler
        run: mix deps.get
      - name: Smoke fixtures
        working-directory: compiler
        run: mix autumn.smoke
        env:
          AUTUMN_VM: ${{ github.workspace }}/vm/.lake/build/bin/autumn
